<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Fix Ban</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 50px;
            margin: 0;
        }

        .box,
        #codeInputBox {
            width: 400px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .option {
            padding: 15px;
            margin: 8px 0;
            background: #eee;
            border-radius: 8px;
            cursor: pointer;
        }

        .option:hover {
            background: #ddd;
        }

        #codeInputBox {
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .error {
            color: red;
            margin-top: 12px;
        }

        #codePanel {
            display: none;
            width: 650px;
            max-width: 92%;
            margin: auto;
            background: #111;
            padding: 25px;
            border-radius: 12px;
            text-align: left;
            font-family: Consolas, monospace;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            color: #00ff66;
        }

        #programTitle {
            text-align: center;
            color: #00ff66 !important;
        }

        .line {
            margin: 10px 0;
            white-space: pre-wrap;
        }

        #codePanel.failed {
            color: red;
        }

        #codePanel.failed h2 {
            color: #00ff66 !important;
        }
    </style>
</head>

<body>

<div class="box" id="mainBox">

    <h2>Nhập ID</h2>

    <input
        type="text"
        id="userID"
        placeholder="ID gồm 8-11 số"
        maxlength="11"
        inputmode="numeric"
    >

    <div class="option" onclick="openCodeBox()">
        Dòng 1
    </div>

    <!-- DÒNG 2: CHUYỂN SANG MOON.VN -->
    <div class="option" onclick="window.location.href='https://moon.vn/'">
        Dòng 2
    </div>

    <div class="option">
        Dòng 3
    </div>

</div>


<div id="codeInputBox">

    <h2>Nhập mã</h2>

    <input
        type="text"
        id="codeInput"
        placeholder="Nhập mã xác nhận"
    >

    <button onclick="confirmCode()">
        Xác nhận
    </button>

    <div class="error" id="errorMessage"></div>

</div>


<div id="codePanel">

    <h2 id="programTitle">ĐANG KHỞI CHẠY CHƯƠNG TRÌNH</h2>

    <div class="line" id="line1"></div>
    <div class="line" id="line2"></div>
    <div class="line" id="line3"></div>
    <div class="line" id="line4"></div>
    <div class="line" id="line5"></div>
    <div class="line" id="line6"></div>
    <div class="line" id="line7"></div>
    <div class="line" id="line8"></div>
    <div class="line" id="line9"></div>
    <div class="line" id="line10"></div>
    <div class="line" id="line11"></div>
    <div class="line" id="line12"></div>
    <div class="line" id="line13"></div>
    <div class="line" id="line14"></div>
    <div class="line" id="line15"></div>
    <div class="line" id="line16"></div>
    <div class="line" id="line17"></div>
    <div class="line" id="line18"></div>
    <div class="line" id="line19"></div>
    <div class="line" id="line20"></div>
    <div class="line" id="line21"></div>
    <div class="line" id="line22"></div>
    <div class="line" id="line23"></div>

</div>


<script>

const validCodes = [
    "USERFIXBAN-7KQ2M8X4P1",
    "USERFIXBAN-9A3L7N5R2Q",
    "USERFIXBAN-4X8C1V6B9M",
    "USERFIXBAN-2P7D5K9T3W",
    "USERFIXBAN-6H1Q8Z4L5N",
    "USERFIXBAN-3M9R2X7C8K",
    "USERFIXBAN-8V5B1N6Q3A",
    "USERFIXBAN-1T4W9P2Y7L",
    "USERFIXBAN-5K8M3D1X6R",
    "USERFIXBAN-9Q2A7F4N8C",
    "USERFIXBAN-6X3L9V1P5B",
    "USERFIXBAN-4N7K2R8M1Q",
    "USERFIXBAN-8C5T3Y9D2W",
    "USERFIXBAN-2Z6P1H8K4M",
    "USERFIXBAN-7R9B5X3L1V",
    "USERFIXBAN-3Q8N6A2T5K",
    "USERFIXBAN-1M7C4V9P6X",
    "USERFIXBAN-5D2K8R1N7Q",
    "USERFIXBAN-9L4X6B3M8T",
    "USERFIXBAN-6P1W5Z9C2A"
];


function openCodeBox() {

    const id = document.getElementById("userID").value.trim();

    if (!/^[0-9]{8,11}$/.test(id)) {
        alert("ID phải gồm từ 8 đến 11 chữ số!");
        return;
    }

    document.getElementById("mainBox").style.display = "none";
    document.getElementById("codeInputBox").style.display = "block";
}


function confirmCode() {

    const id = document.getElementById("userID").value.trim();
    const code = document.getElementById("codeInput").value.trim();
    const error = document.getElementById("errorMessage");

    if (!validCodes.includes(code)) {
        error.innerText = "Mã không hợp lệ!";
        return;
    }

    error.innerText = "";

    document.getElementById("codeInputBox").style.display = "none";
    document.getElementById("codePanel").style.display = "block";

    document.getElementById("codePanel").classList.remove("failed");


    setTimeout(() => {
        document.getElementById("line1").innerText =
            "Unban FF ID " + id;
    }, 400);

    setTimeout(() => {
        document.getElementById("line2").innerText =
            "[+] Connecting to Garena FF Server...";
    }, 1000);

    setTimeout(() => {
        document.getElementById("line3").innerText =
            ">>› Injecting payload into";
    }, 1600);

    setTimeout(() => {
        document.getElementById("line4").innerText =
            "com.dts.freefireth...";
    }, 2200);

    setTimeout(() => {
        document.getElementById("line5").innerText =
            "- >> Overriding security token...";
    }, 2800);

    setTimeout(() => {
        document.getElementById("line6").innerText =
            "- >> Fetching player profile data from database...";
    }, 3400);

    setTimeout(() => {
        document.getElementById("line7").innerText =
            "- >> Fetching player profile data from database...";
    }, 4000);

    setTimeout(() => {
        document.getElementById("line8").innerText =
            "- >> Bypassing anti-cheat protection...";
    }, 4600);

    setTimeout(() => {
        document.getElementById("line9").innerText =
            "- >> Decrypting ban status flags...";
    }, 5200);

    setTimeout(() => {
        document.getElementById("line10").innerText =
            "- >> Patching packet headers...";
    }, 5800);

    setTimeout(() => {
        document.getElementById("line11").innerText =
            "- >> Bypassing anti-cheat protection..";
    }, 6400);

    setTimeout(() => {
        document.getElementById("line12").innerText =
            ">> Injecting payload into";
    }, 7000);

    setTimeout(() => {
        document.getElementById("line13").innerText =
            "com.dts.freefireth...";
    }, 7600);

    setTimeout(() => {
        document.getElementById("line14").innerText =
            "- >> Syncing server response packets...";
    }, 8200);

    setTimeout(() => {
        document.getElementById("line15").innerText =
            "- >> Bypassing anti-cheat protection...";
    }, 8800);

    setTimeout(() => {
        document.getElementById("line16").innerText =
            "- >> Decrypting ban status flags...";
    }, 9400);

    setTimeout(() => {
        document.getElementById("line17").innerText =
            "- >> Fetching player profile data from database..";
    }, 10000);

    setTimeout(() => {
        document.getElementById("line18").innerText =
            "- >> Bypassing AES-256 encryption...";
    }, 10600);


    setTimeout(() => {

        document.getElementById("codePanel").classList.add("failed");

        document.getElementById("line19").innerText = "";

        document.getElementById("line20").innerText =
            "[!] UNLOCK FAILED! Server rejected request.";

    }, 11200);

}

</script>

</body>
</html>
